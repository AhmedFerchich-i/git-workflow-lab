name: Teammate (Sam)

# Sam works every 20 minutes between 07:00 and 21:59 UTC (08:00-22:59 in Tunis).
# GitHub may delay scheduled runs by a few minutes when it's busy.
# To pause Sam: Actions tab -> "Teammate (Sam)" -> "..." -> Disable workflow.
on:
  schedule:
    - cron: "*/20 7-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should Sam do right now?"
        type: choice
        default: auto
        options: [auto, land, review, shared, conflict, bughunt]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: teammate
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sam does some work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          git config user.name "Sam (bot teammate)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python bot/teammate.py
